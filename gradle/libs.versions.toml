composeBom = "2026.02.01"
hilt = "2.60.1"
ksp = "2.3.9"
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.4.0"
mapsCompose = "8.3.0"
playServicesMaps = "20.0.0"
androidMapsUtils = "4.0.0"
haze = "1.7.2"
retrofit = "3.0.0"
okhttp = "5.1.0"
kotlinxSerializationJson = "1.9.0"
